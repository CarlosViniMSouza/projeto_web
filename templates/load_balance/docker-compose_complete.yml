services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itens-api
    restart: unless-stopped
    expose:
      - "3000"

  frontend:
    image: nginx:alpine
    container_name: itens-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
