<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <title>Gerenciador de Itens</title>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="text-center mb-4">
                    <h1 class="display-5 fw-bold">
                        Gerenciador de Itens
                    </h1>

                    <p class="lead text-muted">
                        Interface de exemplo conectada à API Node.js do arquivo
                        <code>script.js</code>
                    </p>
                </div>

                <!-- Conexão -->
                <div class="card shadow-sm mb-4">
                    <div class="card-body">

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="card-title mb-0">
                                Conexão com a API
                            </h5>

                            <button
                                class="btn btn-outline-primary"
                                id="checkApiButton"
                                type="button">
                                Testar conexão
                            </button>
                        </div>

                        <p class="mb-2">
                            Endereço configurado:
                            <code id="apiAddress"></code>
                        </p>

                        <div
                            id="connectionStatus"
                            class="alert alert-secondary mb-0"
                            role="status"
                            aria-live="polite">
                        </div>

                    </div>
                </div>

                <!-- Formulário -->
                <div class="card shadow-sm mb-4">
                    <div class="card-body">

                        <h4 id="formTitle" class="mb-3">
                            Cadastrar item
                        </h4>

                        <form id="itemForm">

                            <div class="row g-3 align-items-end">

                                <div class="col-md">
                                    <label
                                        for="itemName"
                                        class="form-label">
                                        Nome do item
                                    </label>

                                    <input
                                        id="itemName"
                                        name="name"
                                        type="text"
                                        class="form-control"
                                        placeholder="Ex.: Caderno"
                                        maxlength="120"
                                        required>
                                </div>

                                <div class="col-auto">
                                    <button
                                        id="submitButton"
                                        type="submit"
                                        class="btn btn-success">
                                        Cadastrar
                                    </button>
                                </div>

                                <div class="col-auto">
                                    <button
                                        id="cancelEditButton"
                                        class="btn btn-outline-secondary"
                                        type="button"
                                        hidden>
                                        Cancelar
                                    </button>
                                </div>

                            </div>

                        </form>

                        <div
                            id="formStatus"
                            class="alert alert-secondary mt-3 mb-0"
                            role="status"
                            aria-live="polite">
                        </div>

                    </div>
                </div>

                <!-- Lista -->
                <div class="card shadow-sm">
                    <div class="card-body">

                        <div class="d-flex justify-content-between align-items-center mb-3">

                            <h4 class="mb-0">
                                Itens cadastrados
                            </h4>

                            <button
                                class="btn btn-outline-primary"
                                id="reloadButton"
                                type="button">
                                Atualizar lista
                            </button>

                        </div>

                        <ul
                            id="itemsList"
                            class="list-group mb-3"
                            aria-live="polite">

                            <li class="list-group-item text-muted">
                                Carregando itens...
                            </li>

                        </ul>

                        <div
                            id="listStatus"
                            class="alert alert-secondary mb-0"
                            role="status"
                            aria-live="polite">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
